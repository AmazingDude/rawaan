# ==============================================================================
# Rawaan Patient Context Engine - Docker Compose for Hackathon Judges
# Run with: docker compose --env-file .env.local up --build
# ==============================================================================

services:
  rawaan:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set the Clerk publishable key; use docker compose --env-file .env.local up --build}
    container_name: rawaan-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - path: .env.local
        required: true
    restart: unless-stopped
